# Local Paper server for development. Offline mode, so bots connect without a Microsoft account.
# Start: MC_EULA=true docker compose -f docker-compose.dev.yml up -d
# Setting MC_EULA=true means you accept the Minecraft EULA: https://www.minecraft.net/eula
services:
  minecraft:
    image: itzg/minecraft-server:java21 # Paper 1.21.6 needs Java 21
    environment:
      EULA: "${MC_EULA:-false}" # the container refuses to start unless this is true
      TYPE: PAPER
      VERSION: "1.21.6" # version recommended by the README
      ONLINE_MODE: "false"
      # Tests edit terrain around bots with RCON; a bot briefly left standing on nothing trips Paper's flight
      # check and gets kicked. A real server may not allow this: see docs/DEV_SETUP.md.
      ALLOW_FLIGHT: "true"
      MEMORY: 2G
      DIFFICULTY: easy
      SPAWN_PROTECTION: "0"
      SEED: "mindcraft-dev" # fixed seed so runs are comparable
      ENABLE_RCON: "true"
      RCON_PASSWORD: dev
      # Paper refuses a second connection from the same IP within 4 s by default, which kicks the second bot
      # whenever two connect back to back (tests, multi-agent runs). Applied to bukkit.yml on every start.
      PATCH_DEFINITIONS: /patches
    ports:
      - "127.0.0.1:55916:25565" # matches the default port in settings.js; not exposed to the LAN
    volumes:
      - ./server_data_dev:/data
      - ./dev/server-patches:/patches:ro
    stdin_open: true
    tty: true

  # A second, identical server for experiments that must not disturb a long run on the first (a soak test sets
  # nothing, but an experiment that sets the time or the weather would change what the soak measures).
  # Start: MC_EULA=true docker compose -f docker-compose.dev.yml --profile lab up -d minecraft-lab
  # Use:   MC_DEV_SERVICE=minecraft-lab MC_PORT=55917 npm run test:integration
  minecraft-lab:
    profiles: ["lab"]
    image: itzg/minecraft-server:java21
    environment:
      EULA: "${MC_EULA:-false}"
      TYPE: PAPER
      VERSION: "1.21.6"
      ONLINE_MODE: "false"
      ALLOW_FLIGHT: "true"
      MEMORY: 2G
      DIFFICULTY: easy
      SPAWN_PROTECTION: "0"
      SEED: "mindcraft-dev"
      ENABLE_RCON: "true"
      RCON_PASSWORD: dev
      PATCH_DEFINITIONS: /patches
    ports:
      - "127.0.0.1:55917:25565"
    volumes:
      - ./server_data_lab:/data
      - ./dev/server-patches:/patches:ro
    stdin_open: true
    tty: true
